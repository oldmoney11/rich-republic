<!DOCTYPE html>
<html>
<head>
    <title>Gallery - Rich Republic</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        .nav {
            background: black;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .grid img {
            width: 100%;
            border-radius: 10px;
            transition: 0.3s;
        }

        .grid img:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="nav">
    <h2>Rich Republic Gallery</h2>
</div>

<div class="container">
    <h1>Our Travel Experiences</h1>
    <p>Memories from our amazing trips</p>
</div>

<div class="grid">
    <img src="/static/images/trip1.jpg">
    <img src="/static/images/trip2.jpg">
    <img src="/static/images/trip1.jpg">
    <img src="/static/images/trip2.jpg">
</div>

</body>
</html>
